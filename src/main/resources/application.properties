#claude kakfa produce config
# Kafka Bootstrap Server
spring.kafka.bootstrap-servers=localhost:9092

# ============================================
# PRODUCER CONFIGURATION
# ============================================

# Serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Acknowledgment mode (all = wait for all replicas)
spring.kafka.producer.acks=all

# Number of retries
spring.kafka.producer.retries=3

# Batch size in bytes
spring.kafka.producer.batch-size=16384

# Buffer memory in bytes
spring.kafka.producer.buffer-memory=33554432

# Compression type (none, gzip, snappy, lz4, zstd)
spring.kafka.producer.compression-type=snappy

# Time to wait before sending batch (milliseconds)
spring.kafka.producer.properties.linger.ms=1

# Maximum request size in bytes
spring.kafka.producer.properties.max.request.size=1048576

# Enable idempotence for exactly-once semantics
spring.kafka.producer.properties.enable.idempotence=true

# Transaction ID prefix (if using transactions)
# spring.kafka.producer.transaction-id-prefix=tx-

# ============================================
# TOPIC CONFIGURATION
# ============================================
kafka.topic.name=order-created

# ============================================
# JSON SERIALIZER CONFIGURATION
# ============================================
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ============================================
# LOGGING
# ============================================
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO
logging.level.com.example.kafka=DEBUG