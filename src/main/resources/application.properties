
# =======================================================
#  BASIC SERVICE INFO
# =======================================================
spring.application.name=order-service
server.port=8082

# =======================================================
#  DATABASE CONFIGURATION (MySQL)
# =======================================================
spring.datasource.url=jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================================================
#  JPA / HIBERNATE CONFIG
# =======================================================
# We use Liquibase for schema, so Hibernate must NOT update schema
spring.jpa.hibernate.ddl-auto=none

# See generated SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect for MySQL 8.x
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# =======================================================
#  LIQUIBASE CONFIG
# =======================================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# =======================================================
#  FEIGN CLIENT CONFIG
# =======================================================
# Enable full Feign logging (DEBUG mode)
feign.client.config.default.loggerLevel=full

# Full logging of Feign HTTP requests and responses
logging.level.feign=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=DEBUG

# Feign + HTTP client timeout configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

# =======================================================
#  OTHER USEFUL CONFIG
# =======================================================

# Do not expose stack trace to client in error responses
server.error.include-stacktrace=never

# To avoid circular reference issues in Feign JSON mapping (we will fix later using DTOs)
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false


customer.service.url=http://localhost:8081

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Exactly-once semantics
spring.kafka.producer.properties.enable.idempotence=true

# Production retry logic
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=15000

# Throughput tuning
spring.kafka.producer.properties.compression.type=snappy
spring.kafka.producer.batch-size=32768
spring.kafka.producer.linger-ms=10
spring.kafka.producer.buffer-memory=33554432
